<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">B's Southern Creations</title>
  <desc id="logoDesc">A pastel floral medallion with the letters BSC and the brand name in script.</desc>
  <defs>
    <style type="text/css">
      @import url("https://fonts.googleapis.com/css2?family=Great+Vibes&amp;display=swap");
      .brand-name { font-family: "Great Vibes", Georgia, cursive; }
      .initials { font-family: "Great Vibes", Georgia, cursive; }
    </style>
    <linearGradient id="petal0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7eb8e8"/><stop offset="100%" stop-color="#a8d4f0"/>
    </linearGradient>
    <linearGradient id="petal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ec4c8"/><stop offset="100%" stop-color="#9ed9d4"/>
    </linearGradient>
    <linearGradient id="petal2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ec99a"/><stop offset="100%" stop-color="#b0dfb8"/>
    </linearGradient>
    <linearGradient id="petal3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8d07a"/><stop offset="100%" stop-color="#c8e29a"/>
    </linearGradient>
    <linearGradient id="petal4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4c86a"/><stop offset="100%" stop-color="#e8dc9a"/>
    </linearGradient>
    <linearGradient id="petal5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8b87a"/><stop offset="100%" stop-color="#f0d0a0"/>
    </linearGradient>
    <linearGradient id="petal6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e89a8a"/><stop offset="100%" stop-color="#f0c0b4"/>
    </linearGradient>
    <linearGradient id="petal7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e088a8"/><stop offset="100%" stop-color="#f0b8c8"/>
    </linearGradient>
    <linearGradient id="petal8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c888c0"/><stop offset="100%" stop-color="#e0b0d8"/>
    </linearGradient>
    <linearGradient id="petal9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a888d0"/><stop offset="100%" stop-color="#c8b0e0"/>
    </linearGradient>
    <linearGradient id="petal10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8888d8"/><stop offset="100%" stop-color="#b0b0e8"/>
    </linearGradient>
    <linearGradient id="petal11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7898e0"/><stop offset="100%" stop-color="#a8c0f0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7eb8e8"/>
      <stop offset="25%" stop-color="#7ec99a"/>
      <stop offset="50%" stop-color="#e8b87a"/>
      <stop offset="75%" stop-color="#c888c0"/>
      <stop offset="100%" stop-color="#8888d8"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6a8fd4"/>
      <stop offset="20%" stop-color="#7a7ac8"/>
      <stop offset="40%" stop-color="#6ab090"/>
      <stop offset="60%" stop-color="#8aba70"/>
      <stop offset="80%" stop-color="#b888c8"/>
      <stop offset="100%" stop-color="#d080a8"/>
    </linearGradient>
    <linearGradient id="letterB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a9ad8"/><stop offset="100%" stop-color="#7eb8e8"/>
    </linearGradient>
    <linearGradient id="letterS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a70c8"/><stop offset="100%" stop-color="#c888c0"/>
    </linearGradient>
    <linearGradient id="letterC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5aaa78"/><stop offset="100%" stop-color="#8ac89a"/>
    </linearGradient>
  </defs>

  <!-- Flower medallion -->
  <g transform="translate(210,175)">
    <!-- 12 petals -->
    <g id="petals">
      <path d="M0,-42 C12,-70 28,-95 0,-118 C-28,-95 -12,-70 0,-42 Z" fill="url(#petal0)" stroke="#fff" stroke-width="2.5" transform="rotate(0)"/>
      <path d="M0,-42 C12,-70 28,-95 0,-118 C-28,-95 -12,-70 0,-42 Z" fill="url(#petal1)" stroke="#fff" stroke-width="2.5" transform="rotate(30)"/>
      <path d="M0,-42 C12,-70 28,-95 0,-118 C-28,-95 -12,-70 0,-42 Z" fill="url(#petal2)" stroke="#fff" stroke-width="2.5" transform="rotate(60)"/>
      <path d="M0,-42 C12,-70 28,-95 0,-118 C-28,-95 -12,-70 0,-42 Z" fill="url(#petal3)" stroke="#fff" stroke-width="2.5" transform="rotate(90)"/>
      <path d="M0,-42 C12,-70 28,-95 0,-118 C-28,-95 -12,-70 0,-42 Z" fill="url(#petal4)" stroke="#fff" stroke-width="2.5" transform="rotate(120)"/>
      <path d="M0,-42 C12,-70 28,-95 0,-118 C-28,-95 -12,-70 0,-42 Z" fill="url(#petal5)" stroke="#fff" stroke-width="2.5" transform="rotate(150)"/>
      <path d="M0,-42 C12,-70 28,-95 0,-118 C-28,-95 -12,-70 0,-42 Z" fill="url(#petal6)" stroke="#fff" stroke-width="2.5" transform="rotate(180)"/>
      <path d="M0,-42 C12,-70 28,-95 0,-118 C-28,-95 -12,-70 0,-42 Z" fill="url(#petal7)" stroke="#fff" stroke-width="2.5" transform="rotate(210)"/>
      <path d="M0,-42 C12,-70 28,-95 0,-118 C-28,-95 -12,-70 0,-42 Z" fill="url(#petal8)" stroke="#fff" stroke-width="2.5" transform="rotate(240)"/>
      <path d="M0,-42 C12,-70 28,-95 0,-118 C-28,-95 -12,-70 0,-42 Z" fill="url(#petal9)" stroke="#fff" stroke-width="2.5" transform="rotate(270)"/>
      <path d="M0,-42 C12,-70 28,-95 0,-118 C-28,-95 -12,-70 0,-42 Z" fill="url(#petal10)" stroke="#fff" stroke-width="2.5" transform="rotate(300)"/>
      <path d="M0,-42 C12,-70 28,-95 0,-118 C-28,-95 -12,-70 0,-42 Z" fill="url(#petal11)" stroke="#fff" stroke-width="2.5" transform="rotate(330)"/>
    </g>
    <!-- Center disc -->
    <circle r="46" fill="#fff" stroke="url(#ring)" stroke-width="3.5"/>
    <!-- BSC initials -->
    <text class="initials" x="0" y="14" text-anchor="middle" font-size="40" letter-spacing="-1">
      <tspan fill="url(#letterB)">B</tspan><tspan fill="url(#letterS)">S</tspan><tspan fill="url(#letterC)">C</tspan>
    </text>
  </g>

  <!-- Brand name -->
  <text class="brand-name" x="360" y="365" text-anchor="middle" font-size="52" fill="url(#nameGrad)">B's Southern Creations</text>
</svg>
